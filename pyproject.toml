[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argoclare"
version = "0.1.0"
description = 'Utilities for regression modeling using Argo data'
readme = 'README.md'
authors=[{name='Sangmin Song', email='sangsong@uw.edu'}]
license = "BSD-3-Clause"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["x_data", "example-data"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, import sorting
ignore = ["E501"]  