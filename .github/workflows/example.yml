name: example
run-name: Drake Passage example (pixi run example)
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi-example:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
          # Fail if pixi.lock is out of date with pixi.toml instead of re-solving
          locked: true
      # Argo L0 downloads (Ifremer ERDDAP), restored here and saved after a successful run;
      # float-import runs with --skip-existing, so cached years are not fetched again
      - uses: actions/cache@v6
        with:
          path: x_data/example_drake/L0/
          key: example-drake-L0-${{ hashFiles('configs/example_drake.toml') }}
      - run: pixi run example
      # Run folder <data_root>/<name>/ from configs/example_drake.toml; uploaded even if
      # the example fails, to see how far it got
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example_drake
          path: |
            x_data/example_drake/
            !x_data/example_drake/argopy-cache/
          if-no-files-found: warn
          retention-days: 14
