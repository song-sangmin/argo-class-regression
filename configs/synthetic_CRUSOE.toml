reg_application = "{data_root}/coreArgo_application_synthetic_{pcm}.csv"
reg_info = "{data_root}/regression_info_synthetic_{pcm}.json"
model_results = "/pscratch/sd/s/sangsong/argoclare_runs/results"

[machines.nersc.files.pc8_gmm6_dbar500]
reg_trainval = "{data_root}/combined_trainval_synthetic_pc8_gmm6_dbar500_seaiceclusters6_acc20261017.csv"
reg_application = "{data_root}/coreArgo_application_synthetic_pc8_gmm6_dbar500_acc20261017.csv"
