[machines.nersc.files.pc8_gmm6_dbar500]
reg_trainval = "{data_root}/combined_trainval_pc8_gmm6_dbar500_seaiceclusters56_acc20261016.csv"
reg_application = "{data_root}/coreArgo_application_pc8_gmm6_dbar500_acc20261016.csv"
