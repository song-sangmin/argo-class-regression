[workspace]
authors = ["Scott Henderson <3924836+scottyhq@users.noreply.github.com>",
           "Sangmin Song <sangsong@uw.edu>"]
channels = ["conda-forge"]
name = "argoclare"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[environments]
dev = ["dev"]

[tasks.get-example-data]
cmd = "test -d example-data/.git || git clone --depth 1 https://github.com/song-sangmin/argo-class-regression-data.git example-data"
description = "Download example data for test script."
# Pixi skips the task when these outputs already exist and are unchanged
outputs = ["example-data/*.csv"]

[tasks.minimal-example]
cmd = "python scripts/model-optimization/run_dask_nested_cv.py RFR rfr_test --data example-data/combined_trainval_pc8_gmm6_dbar500_seaiceclusters56_acc20261016.csv --n-outer 2 --n-inner 2 --savepath /tmp/argotest"
description = "Run a minimal example"
depends-on = ["get-example-data"]

# Pipeline stages (example-workflow-drake.md): pixi run <task> [config] [datasets]
# e.g. pixi run float-import configs/my_region.toml "core bgc". Each step runs with
# --skip-existing, so a rerun skips finished outputs and picks up where the last one stopped.
[tasks.float-import]
description = "L0-L3: download, QC, open-ocean mask and regrid the Argo floats"
args = [{ arg = "config", default = "configs/example_drake.toml" }, { arg = "datasets", default = "core bgc" }]
cmd = """
python scripts/data-processing/create_L0_raw_argo.py --config {{ config }} --datasets {{ datasets }} --skip-existing &&
python scripts/data-processing/create_L1_QC_argo.py --config {{ config }} --datasets {{ datasets }} --skip-existing &&
python scripts/data-processing/create_L2_masked_argo.py --config {{ config }} --datasets {{ datasets }} --skip-existing
{%- if "core" in datasets %} &&
python scripts/data-processing/create_L3_gridded_coreArgo.py --config {{ config }} --skip-existing
{%- endif %}{% if "bgc" in datasets %} &&
python scripts/data-processing/create_L3_gridded_bgcArgo.py --config {{ config }} --skip-existing
{%- endif %}
"""

[tasks.feature-addition]
description = "P1: regression features at each float profile"
args = [{ arg = "config", default = "configs/example_drake.toml" }, { arg = "datasets", default = "core bgc" }]
cmd = "python scripts/data-processing/create_P1_float_features.py --config {{ config }} --datasets {{ datasets }} --skip-existing"

[tasks.clustering]
description = "P2: fit the profile clustering and classify each dataset"
args = [{ arg = "config", default = "configs/example_drake.toml" }, { arg = "datasets", default = "core bgc" }]
cmd = """
python scripts/clustering/fit_argo_clustering.py --config {{ config }} --skip-existing &&
python scripts/clustering/apply_P2_classes.py --config {{ config }} --datasets {{ datasets }} --skip-existing
"""

[tasks.regression-prep]
description = "Training, test and application csvs for the models"
args = [{ arg = "config", default = "configs/example_drake.toml" }]
cmd = "python scripts/regression/regression-input-prep.py --config {{ config }} --skip-existing"

[tasks.modeling]
description = "Nested CV (errors per cluster), then train, apply and test the final models, all with the same algorithm and grid"
args = [{ arg = "config", default = "configs/example_drake.toml" }, { arg = "algorithm", default = "RFR" },
        { arg = "grid", default = "rfr_test" }]
cmd = """
python scripts/model-optimization/run_dask_nested_cv.py {{ algorithm }} {{ grid }} --config {{ config }} &&
python scripts/model-optimization/run_model_application.py --config {{ config }} --algorithm {{ algorithm }} --grid {{ grid }}
"""

[tasks.example]
description = "The whole Drake Passage example (example-workflow-drake.md), about 5 min"
depends-on = ["get-example-data", "float-import", "feature-addition", "clustering", "regression-prep", "modeling"]

[dependencies]
python = ">=3.15.0,<3.16"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pandas = ">=3.0.6,<4"
xarray = ">=2026.9.0,<2027"
netcdf4 = ">=1.7.4,<2"
scikit-learn = ">=1.9.1,<2"
joblib = ">=1.6.0,<2"
xgboost = ">=3.4.2,<4"
dask = ">=2026.8.0,<2027"
gsw = ">=3.6.23,<4"
argopy = ">=1.5.0,<2"
pyco2sys = ">=1.8.3.4,<2"
pyproj = ">=3.8.0,<4"
cartopy = ">=0.26.0,<0.27"
cmocean = ">=4.0.3,<5"
matplotlib = ">=3.11.2,<4"
tqdm = ">=4.70.1,<5"
pip = ">=26.2.2,<27"                # argopy runs `python -m pip list` at import

[pypi-dependencies]
argoclare = { path = ".", editable = true }
solarpy = ">=0.1.3, <0.2"

[feature.dev.dependencies]
jupyterlab = ">=4.6.4,<5"
sphinx = ">=9.2.0,<10"
pre-commit = ">=4.7.0,<5"
nbstripout = ">=0.9.1,<0.10"
ruff = ">=0.17.3,<0.18"
identify = ">=2.6.15,<3"   # pre-commit needs a recent identify (jupyter file type)

[feature.dev.tasks]
format = { cmd = "ruff format src scripts", description = "Format the code with ruff (settings in pyproject.toml)" }
lint = { cmd = "ruff check src scripts", description = "Check the code with ruff (settings in pyproject.toml)" }
